<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>KingSea</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0a0d; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #safe-probe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <canvas id="game" aria-label="KingSea"></canvas>
  <div id="safe-probe"></div>
  <!--KS_SCRIPT-->
</body>
</html>
